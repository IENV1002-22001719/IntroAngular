<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <form>
                        <div class="form-group pt-4">
                            <label for="num1">Numero 1</label>
                            <input [(ngModel)]="num1" name="num1" type="text" class="form-control" id="num1" placeholder="Ingrese número 1" />
                        </div>
                        <div class="form-group pt-4">
                            <label for="num2">Numero 2</label>
                            <input [(ngModel)]="num2" name="num2" type="text" class="form-control" id="num2" placeholder="Ingrese número 2" />
                        </div>

                        <br/>
                        
                        <input type="radio" class="form-check-input" id="suma" name="operacion" value="sumar" [(ngModel)]="operacion">
                        <label class="form-check-label" for="divi">Sumar</label>
                        <br/>

                        <input type="radio" class="form-check-input" id="resta" name="operacion" value="restar" [(ngModel)]="operacion">
                        <label class="form-check-label" for="divi">Restar</label>
                        <br/>

                        <input type="radio" class="form-check-input" id="multiplicar" name="operacion" value="multiplicar" [(ngModel)]="operacion">
                        <label class="form-check-label" for="divi">Multiplicar</label>
                        <br/>

                        <input type="radio" class="form-check-input" id="dividir" name="operacion" value="dividir" [(ngModel)]="operacion">
                        <label class="form-check-label" for="divi">Dividir</label>
                        <br/>
                        <button  type="button" class="btn btn-primary" (click)="calcular()">
                            Calcular
                        </button>
                        <!-- <button (click)="sumar()" type="button" class="btn btn-primary">
                            Sumar
                        </button>
                        <button (click)="restar()" type="button" class="btn btn-primary">
                            Restar
                        </button>
                        <button (click)="multiplicar()" type="button" class="btn btn-primary">
                            Multiplicar
                        </button>
                        <button (click)="dividir()" type="button" class="btn btn-primary">
                            Dividir
                        </button> -->
                    </form>
                </div>
                <div class="col-6">
                    <h3>Resultado: {{resultado}}</h3>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
